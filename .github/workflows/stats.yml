
name: Generate GitHub Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=helium900&show_icons=true&theme=tokyonight
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Most Used Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=helium900&layout=compact&langs_count=8&theme=tokyonight
          path: profile/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Chat Application Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=helium900&repo=chat-application&theme=tokyonight
          path: profile/chat.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Todo Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=helium900&repo=my-todo&theme=tokyonight
          path: profile/todo.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Currency Converter Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=helium900&repo=Currency-Converter&theme=tokyonight
          path: profile/currency.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit Generated Cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg

          if ! git diff --cached --quiet; then
            git commit -m "Update GitHub profile stats"
            git push
          fi
