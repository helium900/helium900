
name: Generate GitHub Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Generate six SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p profile
          python3 - <<'PY'
          import json
          import os
          from collections import Counter
          from html import escape
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          USER = 'helium900'
          DEST = Path('profile')
          DEST.mkdir(exist_ok=True)
          token = os.environ['GITHUB_TOKEN']

          def api(path):
              req = Request('https://api.github.com' + path, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + token,
                  'User-Agent': 'profile-cards-action',
              })
              with urlopen(req, timeout=30) as r:
                  return json.load(r)

          def text(x, y, s, size=17, color='#c9d1d9'):
              return (f'<text x="{x}" y="{y}" fill="{color}" '
                      f'font-family="Arial,sans-serif" font-size="{size}">'
                      f'{escape(str(s))}</text>')

          def svg(name, title, contents, height=190):
              out = (f'<svg xmlns="http://www.w3.org/2000/svg" '
                     f'width="495" height="{height}" viewBox="0 0 495 {height}">'
                     f'<rect x="1" y="1" width="493" height="{height-2}" '
                     f'rx="14" fill="#0d1117" stroke="#30363d"/>'
                     + text(23, 42, title, 23, '#58a6ff')
                     + ''.join(contents) + '</svg>')
              (DEST / name).write_text(out, encoding='utf-8')
              print('Generated:', DEST / name)

          user = api('/users/' + USER)
          repos = []
          for page in range(1, 4):
              page_repos = api(f'/users/{USER}/repos?per_page=100&page={page}&type=owner')
              repos.extend(r for r in page_repos if not r.get('fork', False))
              if len(page_repos) < 100:
                  break

          stars = sum(r.get('stargazers_count', 0) for r in repos)
          svg('stats.svg', 'GitHub Stats', [
              text(25, 96, f'Public repositories: {user.get("public_repos", 0)}'),
              text(25, 123, f'Total public repo stars: {stars}'),
              text(25, 150, f'Followers: {user.get("followers", 0)}'),
              text(25, 177, f'Following: {user.get("following", 0)}'),
          ], 205)

          languages = Counter()
          for repo in repos:
              name = quote(repo['name'], safe='')
              try:
                  languages.update(api(f'/repos/{USER}/{name}/languages'))
              except Exception as e:
                  print('Skipped language fetch:', repo['name'], str(e))

          total = sum(languages.values())
          language_rows = []
          for i, (lang, size) in enumerate(languages.most_common(6)):
              y = 78 + i * 34
              pct = size / total * 100 if total else 0
              language_rows.append(text(25, y, f'{lang}: {pct:.1f}%', 15))
              language_rows.append(
                  f'<rect x="25" y="{y+6}" width="445" height="8" rx="4" fill="#30363d"/>'
                  f'<rect x="25" y="{y+6}" width="{445*size/total:.1f}" '
                  f'height="8" rx="4" fill="#58a6ff"/>'
              )
          if not language_rows:
              language_rows.append(text(25, 91, 'No language data available yet'))
          svg('languages.svg', 'Most Used Languages', language_rows, 295)

          projects = [
              ('chat-application', 'chat.svg', 'Chat Application'),
              ('my-todo', 'todo.svg', 'Todo Application'),
              ('Currency-Converter', 'currency.svg', 'Currency Converter'),
              ('portfolio', 'portfolio.svg', 'Portfolio'),
          ]
          for repo_name, filename, heading in projects:
              repo = next((r for r in repos if r['name'].lower() == repo_name.lower()), None)
              if repo is None:
                  try:
                      repo = api(f'/repos/{USER}/{quote(repo_name)}')
                  except Exception as e:
                      print('Missing repo details:', repo_name, str(e))
                      repo = {}
              description = (repo.get('description') or 'View project on GitHub').strip()
              description = description[:52] + ('...' if len(description) > 52 else '')
              svg(filename, heading, [
                  text(25, 91, description, 15),
                  text(25, 134, 'Stars: ' + str(repo.get('stargazers_count', 0))),
                  text(160, 134, 'Forks: ' + str(repo.get('forks_count', 0))),
                  text(25, 166, 'Language: ' + str(repo.get('language') or 'Not specified'), 15, '#79c0ff'),
              ], 190)
          PY

      - name: Commit SVGs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "All cards are up to date"
          else
            git commit -m "Update profile cards"
            git push origin HEAD:main
          fi
