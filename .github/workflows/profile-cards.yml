
name: Update Profile Cards

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Create stats, language and project cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import textwrap
          from collections import Counter
          from html import escape
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          USER = "helium900"
          OUT = Path("profile")
          OUT.mkdir(exist_ok=True)

          def github(path):
              request = Request(
                  "https://api.github.com" + path,
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "profile-card-generator",
                  },
              )
              try:
                  with urlopen(request, timeout=30) as response:
                      return json.load(response)
              except HTTPError as error:
                  raise RuntimeError(
                      f"GitHub API error {error.code} for {path}: {error.reason}"
                  ) from error
              except URLError as error:
                  raise RuntimeError(f"Network error for {path}: {error}") from error

          def txt(x, y, value, size=16, color="#c9d1d9", weight="normal"):
              return (
                  f'<text x="{x}" y="{y}" fill="{color}" font-size="{size}" '
                  f'font-family="Arial, sans-serif" font-weight="{weight}">'
                  f'{escape(str(value))}</text>'
              )

          def card(file, title, body, height=195):
              content = (
                  f'<svg xmlns="http://www.w3.org/2000/svg" width="500" height="{height}" '
                  f'viewBox="0 0 500 {height}">'
                  f'<rect x="1" y="1" width="498" height="{height-2}" rx="12" '
                  'fill="#0d1117" stroke="#30363d"/>'
                  + txt(22, 43, title, 22, "#58a6ff", "bold")
                  + "".join(body)
                  + "</svg>"
              )
              (OUT / file).write_text(content, encoding="utf-8")
              print("Created", OUT / file)

          user = github(f"/users/{USER}")
          repos = []
          for page in range(1, 6):
              batch = github(f"/users/{USER}/repos?per_page=100&page={page}&type=owner")
              repos += [repo for repo in batch if not repo.get("fork", False)]
              if len(batch) < 100:
                  break

          stars = sum(repo.get("stargazers_count", 0) for repo in repos)
          card("stats.svg", "GitHub Stats", [
              txt(24, 88, f'Public repositories: {user.get("public_repos", 0)}'),
              txt(24, 117, f'Stars received: {stars}'),
              txt(24, 146, f'Followers: {user.get("followers", 0)}'),
              txt(24, 175, f'Following: {user.get("following", 0)}'),
          ], 200)

          languages = Counter()
          for repo in repos:
              try:
                  values = github(f'/repos/{USER}/{quote(repo["name"], safe="")}/languages')
                  languages.update(values)
              except (RuntimeError, KeyError) as error:
                  print("Skipping unavailable language data:", repo["name"], error)

          total = sum(languages.values())
          rows = []
          for index, (language, count) in enumerate(languages.most_common(6)):
              y = 80 + index * 34
              percent = 100 * count / total
              rows.append(txt(24, y, f"{language}  {percent:.1f}%", 14))
              rows.append(f'<rect x="24" y="{y+7}" width="450" height="8" rx="4" fill="#30363d"/>')
              rows.append(f'<rect x="24" y="{y+7}" width="{450*count/total:.1f}" height="8" rx="4" fill="#58a6ff"/>')
          if not rows:
              rows.append(txt(24, 92, "No language data available yet."))
          card("languages.svg", "Most Used Languages", rows, 300)

          featured = [
              ("chat-application", "chat.svg", "Chat Application"),
              ("my-todo", "todo.svg", "Todo Application"),
              ("Currency-Converter", "currency.svg", "Currency Converter"),
              ("portfolio", "portfolio.svg", "Portfolio"),
          ]
          for repo_name, output_file, title in featured:
              repo = next((r for r in repos if r["name"].lower() == repo_name.lower()), None)
              if repo is None:
                  repo = github(f"/repos/{USER}/{quote(repo_name, safe='')}")
              description = textwrap.shorten(
                  repo.get("description") or "View source code on GitHub",
                  width=54, placeholder="..."
              )
              card(output_file, title, [
                  txt(24, 92, description, 14),
                  txt(24, 135, f'Stars: {repo.get("stargazers_count", 0)}'),
                  txt(175, 135, f'Forks: {repo.get("forks_count", 0)}'),
                  txt(24, 170, f'Language: {repo.get("language") or "Not specified"}', 14, "#79c0ff"),
              ], 190)
          PY

      - name: Save SVG cards to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "No card changes to commit"
          else
            git commit -m "Update profile SVG cards"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
